<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Workspace</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel-2:#f9fafb;--sunken:#f1f3f5;--ink:#111827;--ink-2:#374151;--muted:#636c7a;--faint:#7f8793;
  --line:#e5e7eb;--line-2:#eef0f3;--accent:#0f766e;--accent-2:#115e59;--accent-ink:#ffffff;--accent-soft:#e6f4f2;--accent-line:#b7e1dc;
  --ok:#15733a;--ok-soft:#e8f5ec;--warn:#b45309;--warn-soft:#fdf3e2;--err:#b91c1c;--err-soft:#fdecec;--info:#1d4ed8;--info-soft:#e9effd;
  --term:#0f172a;--term-ink:#e2e8f0;--term-muted:#94a3b8;
  --r-lg:14px;--r:10px;--r-sm:8px;
  --sh-1:0 1px 2px rgba(16,24,40,.05);--sh-2:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);--sh-3:0 24px 48px rgba(16,24,40,.18);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f14;--panel:#121820;--panel-2:#151c25;--sunken:#0f141b;--ink:#e6edf3;--ink-2:#c9d4de;--muted:#8b98a7;--faint:#66717e;
  --line:#222c37;--line-2:#1a222c;--accent:#2dd4bf;--accent-2:#5eead4;--accent-ink:#04201d;--accent-soft:#0f2a28;--accent-line:#1d4d48;
  --ok:#4ade80;--ok-soft:#0f2a1a;--warn:#fbbf24;--warn-soft:#2b2110;--err:#f87171;--err-soft:#2c1414;--info:#93c5fd;--info-soft:#132036;
  --term:#05080c;--sh-1:none;--sh-2:none;--sh-3:0 24px 48px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{
  --bg:#0b0f14;--panel:#121820;--panel-2:#151c25;--sunken:#0f141b;--ink:#e6edf3;--ink-2:#c9d4de;--muted:#8b98a7;--faint:#66717e;
  --line:#222c37;--line-2:#1a222c;--accent:#2dd4bf;--accent-2:#5eead4;--accent-ink:#04201d;--accent-soft:#0f2a28;--accent-line:#1d4d48;
  --ok:#4ade80;--ok-soft:#0f2a1a;--warn:#fbbf24;--warn-soft:#2b2110;--err:#f87171;--err-soft:#2c1414;--info:#93c5fd;--info-soft:#132036;
  --term:#05080c;--sh-1:none;--sh-2:none;--sh-3:0 24px 48px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:60;background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--accent);font-weight:600}
.skip:focus{left:12px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0e7490);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.02em;box-shadow:var(--sh-1);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.custom{background:#fff;border:1px solid var(--line);padding:3px}
.brand>div:last-child{min-width:0;flex:1}
.brand-t{font-weight:650;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--panel-2);margin-bottom:14px}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.projcard .nm{font-weight:600;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projcard .st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.warn{background:var(--warn)}
.navgroup{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav{display:grid;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;font-weight:500;width:100%}
.nav button:hover{background:var(--sunken)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--sunken);color:var(--muted);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.lang button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:5px 9px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--sunken);color:var(--ink)}
.iconbtn{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-sm);color:var(--muted);border:1px solid var(--line)}
.iconbtn:hover{color:var(--ink);background:var(--sunken)}
.iconbtn:focus-visible,.lang button:focus-visible{outline:2px solid var(--accent)}
.iconbtn svg.i{width:16px;height:16px}
.ver{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--mono)}

/* main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 32px;min-height:58px}
.crumb{font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.crumb b{color:var(--ink);font-weight:600}
.top .acts{margin-left:auto;display:flex;gap:8px}
.wrap{padding:26px 32px 64px;max-width:1180px}
.page{display:none}
.page.on{display:block;animation:fade .16s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ph{margin:0 0 20px}
.ph h1{font-size:22px;line-height:1.25;letter-spacing:-.015em;font-weight:650;margin:0 0 4px}
.ph p{margin:0;color:var(--muted);max-width:76ch}
h2{font-size:14.5px;font-weight:600;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c-main{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.mb{margin-bottom:16px}

/* buttons, badges */
.btn{cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;color:var(--ink-2);box-shadow:var(--sh-1);white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:#d1d5db}
.btn svg.i{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--err)}
.btn.lg{height:40px;padding:0 16px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.info{background:var(--info-soft);color:var(--info)}
.mono{font-family:var(--mono);font-size:12.5px}

/* overview */
.banner{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px}
.banner.warn{border-color:#f5d9a8;background:var(--warn-soft)}
.banner .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--panel);color:var(--accent);flex:none}
.banner.warn .ic{color:var(--warn)}
.banner b{display:block;margin-bottom:2px}
.banner p{margin:0;color:var(--ink-2);font-size:13.5px}
.banner .r{margin-left:auto;align-self:center}
.summary{display:flex;gap:16px;align-items:center;padding:18px}
.summary .avatar{width:48px;height:48px;font-size:17px;border-radius:12px}
.summary h1{font-size:20px;margin:0;letter-spacing:-.01em;font-weight:650;overflow-wrap:anywhere}
.summary .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.path{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;border:0;background:none;border-radius:6px;padding:1px 4px;margin-left:-4px;overflow-wrap:anywhere;text-align:left}
.path:hover{background:var(--sunken);color:var(--ink)}
.path svg.i{width:13px;height:13px}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.kpi .ic.b{background:var(--info-soft);color:var(--info)}
.kpi .ic.w{background:var(--warn-soft);color:var(--warn)}
.kpi .ic.g{background:var(--ok-soft);color:var(--ok)}
.kpi .v{font-size:22px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k{font-size:12.5px;color:var(--muted)}
.dl{display:grid;gap:0}
.dl .it{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.dl .it:first-child{border-top:0;padding-top:0}
.dl dt{font-size:12.5px;color:var(--muted);font-weight:600}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;font-size:13.5px;color:var(--ink-2)}
.dl dd .sub-h{color:var(--ink);font-weight:600}.dl dd code{background:var(--sunken);border-radius:4px;padding:0 4px;font-size:12px}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:26px 12px;color:var(--muted);font-size:13.5px}
.empty .ic{width:42px;height:42px;border-radius:12px;background:var(--sunken);display:grid;place-items:center;color:var(--faint)}
.actions{display:grid;gap:10px}
.act{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.act:hover{border-color:var(--accent-line);background:var(--panel-2)}
.act:focus-visible{outline:2px solid var(--accent)}
.act .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);flex:none}
.act b{display:block;font-size:13.5px;font-weight:600}
.act span{display:block;font-size:12.5px;color:var(--muted)}
.act .chev{margin-left:auto;color:var(--faint)}
.search{position:relative}
.search input[type=text]{height:32px;min-height:32px;padding:0 10px 0 32px;width:220px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel)}
.search svg.i{position:absolute;left:10px;top:8px;z-index:1;pointer-events:none;width:16px;height:16px;color:var(--faint)}
.chips{display:inline-flex;gap:4px;background:var(--sunken);padding:3px;border-radius:var(--r-sm)}
.chips button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
.chips button:focus-visible{outline:2px solid var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:9px 18px;background:var(--panel-2);border-bottom:1px solid var(--line)}
td{padding:11px 18px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td.id{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap}
.lb-sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.lb-hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.lb-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line-2)}
.lb-det td{background:var(--panel-2)}
.lb-dl{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:4px 14px;margin:0;font-size:12.5px}
.lb-dl dt{color:var(--muted)}.lb-dl dd{margin:0;overflow-wrap:anywhere}
.lb-lk{margin:4px 0 0;padding-left:18px;font-size:12.5px}.lb-lk li{margin:6px 0;overflow-wrap:anywhere}
.tw{overflow-x:auto}

/* forms */
.form{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.field{display:grid;gap:6px;grid-template-columns:minmax(0,1fr);min-width:0}
.field>label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--muted)}
.req{color:var(--err);margin-left:2px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:8px 11px;min-height:36px}
input[type=text]:hover,textarea:hover{border-color:#d1d5db}
textarea{min-height:68px;resize:vertical}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--sunken);padding:3px;border-radius:var(--r-sm);max-width:100%}
.seg button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:6px 12px;border-radius:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.steps{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.steps .s{display:inline-flex;align-items:center;gap:6px}
.steps .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);font-weight:700;font-size:11px;color:var(--muted)}
.steps .s.on .n{background:var(--accent);color:var(--accent-ink)}
.steps .s.on{color:var(--ink)}
.steps .ln{width:22px;height:1px;background:var(--line)}
.formfoot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line-2);background:var(--panel-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.formfoot .r{margin-left:auto;display:flex;gap:8px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:11px 13px;font-size:13px;background:var(--info-soft);color:var(--ink-2)}
.note.warn{background:var(--warn-soft)}
.note svg.i{width:16px;height:16px;margin-top:2px;color:var(--info)}
.note.warn svg.i{color:var(--warn)}
.opt{position:relative;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.opt:hover{border-color:#d1d5db}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt input{position:absolute;opacity:0}
.opt:has(input:focus-visible){outline:2px solid var(--accent)}
.opt .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);font-weight:700;font-size:13px;color:var(--ink-2);flex:none}
.opt:has(input:checked) .ic{background:var(--accent-soft);color:var(--accent)}
.opt b{display:block;font-size:13.5px}
.opt span{display:block;font-size:12.5px;color:var(--muted)}
.opt .mono{word-break:break-all;margin-top:3px;font-size:11.5px}
.drop{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;text-align:center;gap:6px;width:100%;padding:24px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--panel-2);color:var(--muted)}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop:focus-visible{outline:2px solid var(--accent)}
.drop b{color:var(--ink);font-size:13.5px}
.files{display:grid;gap:6px;grid-template-columns:minmax(0,1fr);min-width:0}
.file{display:flex;min-width:0;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 8px 7px 10px;background:var(--panel)}
.file .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file svg.i{color:var(--muted);width:16px;height:16px}

/* packs */
.pack{display:flex;flex-direction:column}
.pack .card-b{flex:1}
.pack-h{display:flex;gap:12px;align-items:flex-start}
.pack-h .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.pack-h b{display:block;font-size:14px;line-height:1.35}
.pack p{margin:10px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pk-intake{margin-top:10px}
.skpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:8px}
.skpick label{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:13px;cursor:pointer;min-width:0}
.skpick label.na{cursor:not-allowed;background:var(--sunken)}
.skpick input{margin-top:3px;accent-color:var(--accent);flex:none}
.skpick .id{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.skpick small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.skpick .empty{grid-column:1/-1}
.skchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.skchips span{font-family:var(--mono);font-size:11.5px;background:var(--sunken);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
.pack-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2)}
.pack-f .r{margin-left:auto;display:flex;gap:8px}

/* maintenance list */
.rows .rw{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line-2)}
.rows .rw:first-child{border-top:0}
.rows .rw .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);flex:none}
.rows .rw b{display:block;font-size:13.5px}
.rows .rw span{display:block;font-size:12.5px;color:var(--muted)}
.rows .rw .btn{margin-left:auto}

/* result sheet */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--sh-3);transform:translateX(102%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s;z-index:31;display:flex;flex-direction:column}
.sheet.on{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sh-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh-h .t{font-weight:650;font-size:15px;min-width:0;overflow-wrap:anywhere}
.sh-h .iconbtn{margin-left:auto}
.sh-b{flex:1;overflow:auto;padding:16px 20px;display:grid;gap:12px;align-content:start;grid-template-columns:minmax(0,1fr)}
.cmd{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-sm);padding:7px 8px 7px 11px}
.cmd code{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-all}
.term{background:var(--term);color:var(--term-ink);border-radius:var(--r);padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;min-height:120px;margin:0}
.term .ok{color:#86efac}.term .warn{color:#fcd34d}.term .err{color:#fca5a5}.term .dim{color:var(--term-muted)}
.sh-f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel-2)}
.sh-f .msg{font-size:12.5px;color:var(--muted);flex:1 1 220px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.page.on,.toast{transition:none!important;animation:none!important}}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r-sm);font-size:13px;opacity:0;transition:.2s;z-index:40;pointer-events:none;box-shadow:var(--sh-2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.off{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:50;text-align:center;padding:30px}
.off.on{display:grid}
.off h1{font-size:20px;margin:12px 0 4px}
.off p{color:var(--muted);margin:0}

/* status page */
.hrow{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.hrow:first-child{border-top:0}
.hrow .hmain{flex:1;min-width:0}
.hrow .hmain b{display:block;font-size:13.5px}
.hrow .hsub{display:block;font-size:12.5px;color:var(--muted)}
.hrow .hfix{margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.hrow .hfix .mono{margin-left:4px}
.hact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dg-p{margin:0 0 8px;color:var(--ink-2);max-width:76ch}
.dg-p.muted{color:var(--muted);margin:0}
.sh-next{font-size:13px;color:var(--ink-2)}
.sh-next b{display:block;margin-bottom:2px}
.sh-next ul{margin:0;padding-left:18px}
/* comparison view */
.dfx{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);font-family:var(--mono);font-size:12.5px;line-height:1.6;min-width:0}
.dfx .dr{display:grid;grid-template-columns:44px 44px 18px minmax(0,1fr);min-width:0}
.dfx .dr>span{padding:0 6px;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dfx .dn{color:var(--muted);text-align:right;background:var(--panel-2);user-select:none}
.dfx .ds{text-align:center;font-weight:700}
.dfx .dr.add{background:var(--ok-soft);color:var(--ok)}
.dfx .dr.del{background:var(--err-soft);color:var(--err)}
.dfx .dr.ctx{color:var(--ink-2)}
.dfx .dr.hunk{grid-template-columns:minmax(0,1fr);background:var(--info-soft);color:var(--info);font-weight:600}
.dfx .dr.hunk>span{padding:2px 8px}

/* journey: steps, prompt, file lists, collapsible management group */
.navmore{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;border-radius:var(--r-sm)}
.navmore:hover{color:var(--ink)}
.navmore:focus-visible{outline:2px solid var(--accent)}
.navmore .chev{margin-left:auto;transition:transform .15s}
.navmore[aria-expanded="true"] .chev{transform:rotate(90deg)}
.navmore .badge{font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px;letter-spacing:0;text-transform:none}
.purpose{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;max-width:80ch}
.purpose.muted{color:var(--muted)}
.flow{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:12px;counter-reset:f}
.flow li{counter-increment:f;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:13.5px;color:var(--ink-2)}
.flow li::before{content:counter(f);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}
.flow li b{color:var(--ink);font-weight:600}
.flow li .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.flow li .hact{margin-top:6px}
.prompt{margin:10px 0;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.flist{display:grid}
.flist .fr{display:flex;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line-2);min-width:0}
.flist .fr:first-child{border-top:0}
.flist .fr .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);flex:none}
.flist .fr .nm{flex:1;min-width:0}
.flist .fr .nm b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist .fr .nm span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist .more{padding:10px 18px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2)}
.where{border:1px dashed var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.where .mono{color:var(--ink)}
.done-h{display:flex;gap:12px;align-items:flex-start}
.done-h .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.choice{display:grid;gap:12px}
.sticky{position:sticky;top:78px}
@media (max-width:1100px){.sticky{position:static}}
@media (max-width:1100px){.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c-main{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .navgroup{display:none}
  .top{position:static;padding:12px 16px;flex-wrap:wrap}
  .wrap{padding:20px 16px 48px}
  .c2,.c3{grid-template-columns:1fr}
  .dl .it{grid-template-columns:minmax(0,1fr);gap:2px}
  .card-h .r{margin-left:0;width:100%;flex-wrap:wrap}
  .search{flex:1;min-width:0}
  .search input[type=text]{width:100%}
  th[style]{width:auto!important}
  .card-h{flex-wrap:wrap}
  .summary{flex-wrap:wrap}
}
@media (max-width:480px){.c4{grid-template-columns:1fr 1fr}.top .acts .btn>span:not([data-ico]){display:none}
  .dfx .dr{grid-template-columns:30px 30px 14px minmax(0,1fr)}.dfx .dr>span{padding:0 4px}.hrow{padding:12px 14px}}
</style>
</head>
<body>
<a class="skip" href="#content" data-t="skip"></a>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo" id="sb-logo">LW</div><div><div class="brand-t" id="sb-title">Local Agent Workspace</div><div class="brand-s" id="sb-sub" data-t="panel"></div></div></div>
  <div class="projcard"><div class="avatar" id="sb-av">·</div><div style="min-width:0"><div class="nm" id="sb-name">…</div><div class="st"><span class="dot" id="sb-dot"></span><span id="sb-st"></span></div></div></div>
  <div class="navgroup" data-t="g_work"></div>
  <div class="nav" id="nav1"></div>
  <button class="navmore" id="nav-more" aria-expanded="false" aria-controls="nav2"><span data-t="g_manage"></span><span class="badge" id="nav-more-b" hidden></span><span class="chev" data-ico="chev"></span></button>
  <div class="nav" id="nav2" hidden></div>
  <div class="side-foot">
    <div class="lang" role="group" data-tt="lang_group"><button data-lang="vi" aria-pressed="true">VI</button><button data-lang="en" aria-pressed="false">EN</button></div>
    <button class="iconbtn" id="b-theme" data-tt="theme"></button>
    <button class="iconbtn" id="b-quit" data-tt="quit"></button>
    <span class="ver" id="sb-ver"></span>
  </div>
</aside>

<main class="main">
  <header class="top">
    <div class="crumb"><span id="cr-proj"></span> / <b id="cr-page"></b></div>
    <div class="acts">
      <button class="btn" data-open="" data-tt="open_folder"><span data-ico="folder"></span><span data-t="open_folder"></span></button>
      <button class="btn" id="b-guide" data-tt="guide"><span data-ico="book"></span><span data-t="guide"></span></button>
    </div>
  </header>
  <div class="wrap" id="content" tabindex="-1">

  <!-- HOME: template = create a project; project = the work; unknown = ask the role first -->
  <section class="page on" id="pg-home">
    <div class="banner warn" id="bn-tx" hidden><div class="ic" data-ico="alert"></div><div><b data-t="tx_banner_t"></b><p data-t="tx_banner_p"></p></div><div class="r"><button class="btn pri" data-goto="health" data-t="tx_banner_b"></button></div></div>
    <div class="banner warn" id="bn-merge" hidden><div class="ic" data-ico="merge"></div><div><b data-t="bn_merge_t"></b><p data-t="bn_merge_p"></p></div><div class="r"><button class="btn" data-goto="merges" data-t="bn_merge_b"></button></div></div>

    <div id="home-tpl" hidden>
      <div class="ph"><h1 data-t="np_h"></h1><p data-t="np_p"></p></div>
      <div class="card mb" id="np-done" hidden></div>
      <div class="grid c-main mb">
        <div class="card"><div class="card-b form">
          <div class="field"><label for="np-name"><span data-t="np_name"></span><span class="req">*</span></label><input type="text" id="np-name" autocomplete="off"><span class="hint" style="margin:0" data-t="np_name_h"></span></div>
          <div class="field"><span class="flabel" data-t="f_lang"></span><div class="seg" role="group" id="np-lang" data-tt="f_lang"><button aria-pressed="true" data-v="vi">Tiếng Việt</button><button aria-pressed="false" data-v="en">English</button></div><span class="hint" style="margin:0" data-t="np_lang_h"></span></div>
          <div class="field"><label for="np-dest" data-t="np_dest"></label><div class="inline"><input type="text" id="np-dest"><button class="btn" data-pick="np-dest"><span data-t="choose"></span></button></div><span class="hint" style="margin:0" data-t="np_dest_h"></span></div>
          <div class="where" id="np-where" aria-live="polite"></div>
        </div><div class="formfoot"><div class="steps"><span class="s on"><span class="n">1</span><span data-t="preview"></span></span><span class="ln"></span><span class="s"><span class="n">2</span><span data-t="apply"></span></span></div><div class="r"><button class="btn pri lg" id="np-run"><span data-ico="eye"></span><span data-t="np_run"></span></button></div></div></div>
        <div class="card"><div class="card-h"><span data-ico="list"></span><h2 data-t="np_after"></h2></div><div class="card-b"><ol class="flow" id="np-flow"></ol></div></div>
      </div>
      <div class="note"><span data-ico="shield"></span><span data-t="np_keep"></span></div>
    </div>

    <div id="home-unk" hidden>
      <div class="ph"><h1 data-t="unk_h"></h1><p data-t="unk_p"></p></div>
      <div class="grid c2 choice">
        <button class="act" data-goto="setup"><span class="ic" data-ico="file"></span><span><b data-t="unk_proj"></b><span data-t="unk_proj_d"></span></span><span class="chev" data-ico="chev"></span></button>
        <button class="act" id="unk-tpl"><span class="ic" data-ico="book"></span><span><b data-t="unk_tpl"></b><span data-t="unk_tpl_d"></span></span><span class="chev" data-ico="chev"></span></button>
      </div>
    </div>

    <div id="home-prj" hidden>
      <div class="card mb"><div class="summary"><div class="avatar" id="ov-av">·</div><div style="min-width:0;flex:1"><h1 id="ov-name">…</h1><p class="purpose" id="ov-purpose"></p><div class="meta"><button type="button" class="path" id="ov-path"></button><span id="ov-tags"></span></div></div></div></div>
      <div class="grid c-main">
        <div>
        <div class="card mb"><div class="card-h"><span data-ico="activity"></span><h2 data-t="cont_t"></h2><div class="r"><span class="tag" id="st-time" hidden></span></div></div><div class="card-b" id="st-box"></div>
          <div class="formfoot"><button class="btn ghost" data-open=".agent/STATE.md"><span data-ico="file"></span><span data-t="st_full"></span></button></div></div>
        <div class="card mb" id="cd-card"><div class="card-h"><span data-ico="file"></span><h2 data-t="cd_t"></h2><div class="r"><span class="tag" id="cd-tag" hidden></span></div></div><div class="card-b" id="cd-box" aria-live="polite"></div></div>
        <div class="card mb"><div class="card-h"><span data-ico="library"></span><h2 data-t="src_t"></h2><span class="sub" id="src-n"></span><div class="r"><button class="btn" data-open="references" data-tt="src_open"><span data-ico="folder"></span><span data-t="open_dir"></span></button></div></div><div class="flist" id="src-list"></div></div>
        <div class="card mb"><div class="card-h"><span data-ico="inbox"></span><h2 data-t="out_t"></h2><span class="sub" id="out-n"></span><div class="r"><button class="btn" data-open="output" data-tt="out_open"><span data-ico="folder"></span><span data-t="open_dir"></span></button></div></div><div class="flist" id="out-list"></div></div>
        </div>
        <div>
        <div class="card mb sticky"><div class="card-h"><span data-ico="spark"></span><h2 data-t="ag_t"></h2></div><div class="card-b">
          <ol class="flow" id="ag-steps"></ol>
          <div class="seg" role="group" id="ag-mode" data-tt="ag_mode"><button aria-pressed="true" data-v="start" data-t="ag_start"></button><button aria-pressed="false" data-v="cont" data-t="ag_cont"></button></div>
          <p class="hint" id="ag-mode-h"></p>
          <div class="prompt" id="ag-prompt"></div>
          <div class="hact"><button class="btn pri" id="ag-copy"><span data-ico="copy"></span><span data-t="ag_copy"></span></button></div>
          <p class="hint" id="ag-verify"></p></div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="page" id="pg-library">
    <div class="ph"><h1 data-t="nav_library"></h1><p data-t="lb_p"></p></div>
    <div class="banner" id="lb-none" hidden><div class="ic" data-ico="library"></div><div><b data-t="lb_none_t"></b><p data-t="lb_none_p"></p></div><div class="r"><button class="btn pri" id="lb-init" data-t="lb_init"></button></div></div>
    <div class="note warn mb" id="lb-warn" hidden></div>
    <div class="grid c4 mb" id="lb-kpi">
      <div class="card kpi"><div class="ic" data-ico="file"></div><div><div class="v" id="lb-rows">–</div><div class="k" data-t="lb_k1"></div></div></div>
      <div class="card kpi"><div class="ic g" data-ico="folder"></div><div><div class="v" id="lb-files">–</div><div class="k" data-t="lb_k2"></div></div></div>
      <div class="card kpi"><div class="ic w" data-ico="alert"></div><div><div class="v" id="lb-noft">–</div><div class="k" data-t="lb_k3"></div></div></div>
      <div class="card kpi"><div class="ic b" data-ico="search"></div><div><div class="v" id="lb-chk">–</div><div class="k" data-t="lb_k4"></div></div></div>
    </div>
    <div class="card mb"><div class="card-h"><span data-ico="search"></span><h2 data-t="lb_find"></h2><div class="r">
      <div class="chips" id="lb-grp" data-tt="lb_group"></div>
      <button class="btn" data-open="references/_INDEX.xlsx"><span data-ico="file"></span><span data-t="lb_open_idx"></span></button>
      <button class="btn" data-open="references"><span data-ico="folder"></span>references</button>
      <button class="btn" id="lb-check"><span data-ico="shield"></span><span data-t="lb_check"></span></button>
      <button class="btn" id="lb-sync" data-tt="lb_sync_tt"><span data-ico="refresh"></span><span data-t="lb_sync"></span></button></div></div>
      <div class="card-b"><div class="inline"><label class="sr" for="lb-q" data-t="lb_q_label"></label><input type="text" id="lb-q"><button class="btn pri" id="lb-go"><span data-ico="search"></span><span data-t="lb_go"></span></button></div>
        <p class="lb-hint" id="lb-hint"></p></div>
      <div class="note mb lb-msg" id="lb-msg" role="status" hidden></div>
      <div class="tw"><table><thead><tr><th style="width:34px"><span class="sr" data-t="lb_c0"></span></th><th style="width:170px" data-t="lb_c1"></th><th data-t="lb_c2"></th><th style="width:170px" data-t="lb_c3"></th><th style="width:210px" data-t="lb_c4"></th><th style="width:150px" data-t="lb_c5"></th></tr></thead><tbody id="lb-rows-t"></tbody></table></div>
      <div class="card-b lb-bar"><span class="sub" id="lb-selN"></span><button class="btn pri" id="lb-copy" disabled><span data-ico="copy"></span><span data-t="lb_copy"></span></button><button class="btn ghost" id="lb-clear" data-t="lb_clear" disabled></button><span class="sub" data-t="lb_copy_note"></span></div>
    </div>
  </section>

  <!-- CHECK -->
  <section class="page" id="pg-check">
    <div class="ph"><h1 data-t="nav_check"></h1><p data-t="ck_p"></p></div>
    <div class="card" style="max-width:820px"><div class="card-b form">
      <button class="drop" id="ck-drop"><span data-ico="upload"></span><b data-t="ck_drop"></b><span data-t="ck_types"></span></button>
      <div class="field"><label for="ck-path" data-t="ck_or"></label><div class="inline"><input type="text" id="ck-path" placeholder="D:\...\output\bao-cao.docx"><button class="btn" id="ck-add"><span data-ico="plus"></span><span data-t="add"></span></button></div></div>
      <div class="files" id="ck-files"></div>
      <label class="check"><input type="checkbox" id="ck-decl"><span data-t="ck_decl"></span></label>
    </div><div class="formfoot"><span class="note" style="background:none;padding:0"><span data-ico="info"></span><span data-t="ck_ro"></span></span><div class="r"><button class="btn pri lg" id="ck-run"><span data-ico="check"></span><span data-t="ck_run"></span></button></div></div></div>
  </section>

  <!-- MERGES -->
  <section class="page" id="pg-merges">
    <div class="ph"><h1 data-t="nav_merges"></h1><p data-t="mg_p"></p></div>
    <div class="note warn mb"><span data-ico="shield"></span><span data-t="mg_safe"></span></div>
    <div class="card"><div class="card-h"><span data-ico="merge"></span><h2 data-t="mg_title"></h2><span class="sub" id="mg-count"></span></div>
      <div class="tw"><table><thead><tr><th data-t="mg_file"></th><th style="width:130px" data-t="mg_origin"></th><th style="width:150px" data-t="mg_state"></th><th style="width:310px" data-t="mg_actions"></th></tr></thead><tbody id="mg-rows"></tbody></table></div>
    </div>
  </section>

  <!-- PACKS -->
  <section class="page" id="pg-packs">

 cd_prompt:['Tiếp tục sửa bản nháp hiện tại: "%p" (mã bản %r). Giữ nguyên bản cũ, không ghi đè file này. Tạo một bản mới bằng tools/publish_new.py (P-CN1) với request_id mới, cùng work_id. Sau khi tạo xong, chọn bản mới làm Nháp hiện tại bằng: python tools/current_draft.py select --rid <mã bản mới> (xem trước, rồi --apply). Nếu chọn thất bại, nói rõ file đã tạo nhưng chưa cập nhật lựa chọn; không xóa hay tạo lại.','Keep editing the current draft: "%p" (revision id %r). Keep the old revision and do not overwrite this file. Create a new revision with tools/publish_new.py (P-CN1) using a new request_id and the same work_id. Then make it the current draft with: python tools/current_draft.py select --rid <new revision id> (preview, then --apply). If selecting fails, say clearly that the file was created but the choice was not updated; do not delete or recreate it.'],
 g_manage:['Quản lý và bảo trì','Manage and maintain'],nav_new:['Tạo dự án mới','New project'],nav_start:['Bắt đầu','Start'],
 mk_p:['Trợ lý AI tự dùng khả năng sẵn có của ứng dụng hoặc một kỹ năng bổ sung dưới đây khi việc cần; bạn không phải nêu tên kỹ năng khi giao việc. Trang này để xem các kỹ năng và quản lý gói bổ sung theo lĩnh vực.','The AI assistant uses the app’s own abilities or an add-on skill below when the task needs it; you never have to name a skill. This page is for reviewing skills and managing domain packs.'],
 pk_h:['Gói bổ sung theo lĩnh vực','Domain packs'],

 np_h:['Tạo dự án mới','Create a new project'],np_p:['Thư mục này là bộ mẫu gốc: giữ nguyên để tạo các dự án sau. Mỗi dự án là một thư mục riêng, dùng bản sao của bộ mẫu, đặt tại nơi bạn chọn; mặc định cùng cấp với bộ mẫu.','This folder is the original template: keep it as is for future projects. Each project is its own folder, using a copy of the template, in the location you choose; by default, beside the template.'],
 np_name:['Tên công việc','Task name'],np_name_h:['Dùng làm tên thư mục dự án. Ví dụ: Biên bản họp Tổ Tiếp nhận.','Becomes the project folder name. Example: Intake team meeting minutes.'],
 np_dest:['Nơi lưu dự án','Project location'],np_dest_h:['Chọn thư mục sẽ chứa dự án; công cụ tạo bên trong một thư mục mang tên công việc. Mặc định là thư mục đang chứa bộ mẫu.','Choose the folder that will hold the project; a folder named after the task is created inside it. Defaults to the folder that holds the template.'],

 np_f2:['Mở dự án bằng ứng dụng AI','Open the project in your AI app'],np_f2d:['Trong Claude, Codex hoặc Gemini, mở (hoặc thêm) thư mục dự án và cho phép đọc, ghi file trong đó.','In Claude, Codex or Gemini, open (or add) the project folder and allow reading and writing files in it.'],

 np_f4:['Phiên sau: tiếp tục','Next session: continue'],np_f4d:['Mở APP trong thư mục dự án; mục "Tiếp tục công việc" cho biết việc đang đến đâu.','Open APP in the project folder; "Continue the work" shows where things stand.'],
 np_keep:['Không làm việc trong bộ mẫu. Không có Python: sao chép cả thư mục bộ mẫu (kể cả thư mục ẩn .agent), đổi tên rồi mở bằng ứng dụng AI; xem Hướng dẫn.','Do not work inside the template. Without Python: copy the whole template folder (including the hidden .agent folder), rename it and open it in your AI app; see the Guide.'],
 np_need:['Nhập tên công việc trước.','Type a task name first.'],
 np_done_t:['Đã tạo dự án','Project created'],np_done_p:['Bộ mẫu gốc không thay đổi. Từ giờ làm việc trong thư mục dự án mới này. Mở thư mục để chép tài liệu nguồn vào; mở bảng điều khiển dự án để lấy lời nhắc cho trợ lý AI. Hai nút này không mở hay kết nối ứng dụng AI.','The original template is unchanged. From now on, work in this new project folder. Open the folder to copy source documents in; open the project panel to get the message for your AI assistant. Neither button opens or connects your AI app.'],

 ag_verify:['Đối chiếu tên dự án «%s» và các file trợ lý liệt kê với thư mục bạn đã mở và mục Tài liệu nguồn. Nếu sai hoặc thiếu nguồn, kiểm tra lại thư mục đã cấp quyền cho ứng dụng.','Compare the project name “%s” and the files listed by the assistant with the folder you opened and with Source documents. If the name or sources do not match, check which folder the app has access to.'],
 pr_start:['Đây là thư mục dự án «%s». Trước khi làm:\n1. Đọc AGENTS.md, PROJECT.md và .agent/STATE.md.\n2. Nhắc lại tên dự án và liệt kê tài liệu nguồn bạn thấy trong references/.\n\nViệc cần làm: [mô tả việc và kết quả cần nhận, ví dụ: lập biên bản họp từ ghi chú trong references/]\n\nLưu kết quả vào output/. Chỗ nguồn không có thông tin thì ghi "cần xác nhận", không đoán. Không sửa file nguồn. Cuối phiên cập nhật .agent/STATE.md bằng lời văn công việc dễ hiểu.','This is the project folder “%s”. Before you start:\n1. Read AGENTS.md, PROJECT.md and .agent/STATE.md.\n2. Repeat the project name and list the source documents you find in references/.\n\nTask: [describe the task and the result you need, e.g. write meeting minutes from the notes in references/]\n\nSave the result in output/. Where the sources lack information, write “to be confirmed” instead of guessing. Do not edit the source files. At the end, update .agent/STATE.md in plain work language.'],
 pr_cont:['Tiếp tục công việc trong dự án «%s». Đọc .agent/STATE.md và PROJECT.md, rồi cho tôi biết: mục tiêu, bản kết quả hiện hành trong output/, việc đang dở và bước tiếp theo. Chưa sửa file nào cho tới khi tôi xác nhận.','Continue the work in project “%s”. Read .agent/STATE.md and PROJECT.md, then tell me: the goal, the current result in output/, what is unfinished and the next step. Do not change any file until I confirm.'],

 mg_safe:['Ứng dụng chỉ theo dõi file do bộ công cụ quản lý và không tự hợp nhất. Với tám tài liệu hướng dẫn Markdown được hỗ trợ, bản hiện hành chỉ bị thay khi bạn xem so sánh rồi bấm “Dùng bản mới”; cả hai bản được lưu trước và bản `.new` vẫn còn. Mục chỉ biến mất sau khi bạn xử lý và bỏ file `.new`.','The panel tracks only package-managed files and never merges automatically. For the eight supported Markdown guides, the current file is replaced only after you look at the comparison and press “Use the new copy”; both versions are stored first and the `.new` copy stays. An item disappears only after you handle it and remove its `.new` file.'],

 mp_pv_fail:['Chưa xem trước được việc thay. Không có gì bị thay đổi. Bước tiếp: đóng cửa sổ rồi mở so sánh lại, hoặc tự sửa file.','The replace preview could not be loaded. Nothing was changed. Next step: close this window and open the comparison again, or edit the file yourself.'],
 mp_unsupported:['Ứng dụng không thay bản hiện hành của file này. Hãy so sánh hai bản rồi xử lý theo nút có ở hàng: nếu hàng của file có nút “Giữ bản hiện hành, lưu .new” thì dùng nút đó; file không có nút thì tự đối chiếu và xử lý thủ công theo người phụ trách file đó. Không xóa .new hay sửa MANIFEST chỉ để qua kiểm tra.','The app does not replace the current copy of this file. Compare the two copies, then handle it by what the row offers: if the row of the file has a "Keep current, store .new" button, use that button; for a file without one, compare and handle it by hand with whoever owns that file. Do not delete the .new or edit MANIFEST just to pass a check.'],
 mp_r_identical:['Hai bản giống hệt nhau nên không có gì để thay. Bản .new vẫn nằm trong danh sách chờ.','The two versions are identical, so there is nothing to replace. The .new copy stays in the pending list.'],
 mp_r_current_missing:['Chưa có bản hiện hành nên không có bản cũ để lưu; ứng dụng không thay tự động. Không có gì bị thay đổi.','There is no current file, so there is no old version to store; the app does not replace it. Nothing was changed.'],
 mp_r_candidate_missing:['Không còn bản .new để dùng. Không có gì bị thay đổi.','The .new copy is gone. Nothing was changed.'],

 mp_r_too_large:['File lớn hơn giới hạn so sánh nên ứng dụng không thay tự động. Không có gì bị thay đổi.','The file is larger than the comparison limit, so the app does not replace it. Nothing was changed.'],
 mp_r_truncated:['Phần khác biệt quá dài để xem hết nên ứng dụng không thay tự động. Không có gì bị thay đổi.','The differences are too long to review in full, so the app does not replace it. Nothing was changed.'],
 mp_r_unsafe:['Không kiểm được an toàn của đường dẫn hoặc không đọc được file (liên kết, thư mục lạ hoặc lỗi đọc), nên không thay. Không có gì bị thay đổi.','The path could not be checked as safe or the file could not be read (a link, an unexpected folder or a read error), so it is not replaced. Nothing was changed.'],
 mp_r_pending:['Đang có giao dịch lưu file chưa hoàn tất nên chưa thay. Bước tiếp: mở trang Tình trạng ứng dụng, chọn Tiếp tục hoặc Phục hồi, rồi so sánh lại.','An unfinished file transaction exists, so nothing is replaced. Next step: open App status, choose Resume or Roll back, then compare again.'],
 mp_r_other:['Ứng dụng không thay tự động mục này. Không có gì bị thay đổi.','The app does not replace this item automatically. Nothing was changed.'],
 mp_will_cur:['Bản hiện hành sẽ bị thay bằng đúng nội dung bản .new bạn vừa xem ở dưới.','The current file will be replaced with exactly the .new content you are looking at below.'],
 mp_will_save:['Trước khi thay, cả hai bản được lưu vào thư mục sao lưu của dự án; bản .new vẫn ở nguyên chỗ cũ.','Before the replacement, both versions are stored in the project backup folder; the .new copy stays where it is.'],
 mp_will_pend:['Mục vẫn nằm trong danh sách chờ hợp nhất; thay file chưa phải là xử lý xong mục này.','The item stays in the pending list; replacing the file does not settle it.'],
 mp_will_html:['Bản HTML của hướng dẫn chưa được dựng lại từ nội dung mới.','The HTML version of the guide is not rebuilt from the new content.'],
 mp_use:['Dùng bản mới (giữ .new)','Use the new copy (keep .new)'],mp_keep:['Giữ bản của tôi','Keep mine'],mp_manual:['Tự sửa','Edit it myself'],

 mp_done_rec:['Lấy lại bản cũ: mở file current.txt dưới đây bằng trình soạn thảo rồi lưu thành một file mới. Ứng dụng không có nút hoàn tác.','To get the old version back: open the current.txt file below in an editor and save it as a new file. The app has no undo button.'],
 mp_arc_cur:['Bản cũ (current.txt)','Old version (current.txt)'],mp_arc_new:['Bản mới đã chọn (incoming.txt)','Chosen new version (incoming.txt)'],
 mp_live_changed:['Lưu ý: file .new đã đổi sau khi bạn xem. Bản đã thay và bản lưu là bản bạn đã xem; file .new hiện tại được giữ nguyên.','Note: the .new file changed after you looked at it. The replacement and the stored copy are what you previewed; the current .new file is left as it is.'],

 mp_blocked:['Chưa thay được và chưa ghi gì. Bước tiếp: so sánh lại; nếu vẫn bị chặn, tạo gói chẩn đoán.','It could not be replaced and nothing was written. Next step: compare again; if it is still blocked, create a diagnostics bundle.'],
 mp_partial:['Việc thay bị dừng giữa chừng: một số file có thể đã được ghi, nên chưa thể coi là hoàn tất. Mã giao dịch: %s. Bước tiếp: mở trang Tình trạng ứng dụng; Tiếp tục để hoàn tất việc thay, hoặc Phục hồi để đưa file về như trước (phần sao lưu vừa ghi sẽ bị bỏ). Đừng sửa file này trong lúc đó.','The replacement stopped midway: some files may have been written, so it is not complete. Transaction: %s. Next step: open App status; Resume to finish the replacement, or Roll back to restore the previous state (the backup just written is dropped). Do not edit this file meanwhile.'],
 mp_unproven:['Chưa xác minh được kết quả cuối. Mã giao dịch: %s. Bước tiếp: kiểm tra bản hiện hành và các bản lưu trước khi thao tác tiếp; Tiếp tục/Phục hồi chỉ dùng nếu giao dịch còn dở.','The final outcome could not be verified. Transaction: %s. Next step: inspect the current file and stored copies before proceeding; Resume/Roll back only apply to an unfinished transaction.'],
 mp_err:['Chưa thay được. Không có file nào bị thay đổi. Bước tiếp: thử lại; nếu vẫn lỗi, tạo gói chẩn đoán.','It could not be replaced. No file was changed. Next step: try again; if it still fails, create a diagnostics bundle.'],
 mp_unknown:['Chưa biết kết quả vì mất kết nối với ứng dụng. Bước tiếp: mở trang Tình trạng ứng dụng để xem có giao dịch dở không, và kiểm tra file trước khi thử lại.','The outcome is not known because the connection to the app was lost. Next step: open App status to look for an unfinished transaction, and check the file before trying again.'],
 mf_intro:['Muốn giữ nguyên bản hiện hành và không chờ bản .new nữa? Lưu .new vào thư mục lưu trữ để mục này rời danh sách chờ. Chưa có gì được ghi cho đến khi bạn xem trước và xác nhận.','Want to keep the current file and stop waiting on the .new copy? Store the .new in the archive folder so this item leaves the pending list. Nothing is written until you preview and confirm.'],
 mf_entry:['Giữ bản hiện hành, lưu .new','Keep current, store .new'],
 mf_entry_note:['Đây là file hướng dẫn cho agent. Công cụ chỉ lưu bản .new vào thư mục lưu trữ; nội dung .new không được áp vào bản hiện hành. Muốn dùng nội dung mới, tự sửa bản hiện hành bằng trình soạn thảo rồi xem trước lại.','This is an instruction file for agents. The tool only stores the .new copy in the archive folder; its content is not applied to the current file. To use the new content, edit the current file yourself in an editor and preview again.'],
 mf_btn:['Lưu .new và kết thúc chờ','Save .new and end the pending item'],mf_back:['Quay lại','Go back'],mf_recheck:['Kiểm lại kết quả','Check the result again'],
 mf_pv_fail:['Chưa xem trước được việc lưu .new. Không có gì bị thay đổi. Bước tiếp: quay lại rồi mở so sánh lại.','The save preview could not be loaded. Nothing was changed. Next step: go back and open the comparison again.'],
 mf_h:['Lưu .new và kết thúc chờ','Save .new and end the pending item'],
 mf_will_cur:['Bản hiện hành được giữ nguyên, không bị ghi hay thay.','The current file is kept exactly as it is; it is not written or replaced.'],
 mf_will_save:['Trước hết, bản hiện hành và bản .new bạn vừa xem được lưu vào thư mục lưu trữ của dự án (.agent/merge-backups).','First, the current file and the .new copy you just looked at are stored in the project archive folder (.agent/merge-backups).'],
 mf_will_move:['Chỉ khi việc lưu đã hoàn tất và được kiểm lại, file .new mới được chuyển (không xóa) vào cùng thư mục đó, nên mục này không còn nằm trong danh sách chờ.','Only once the storing is complete and verified is the .new file moved (not deleted) into that same folder, so this item leaves the pending list.'],
 mf_will_get:['Vẫn lấy lại được bằng tay: mở file trong thư mục lưu trữ bằng trình soạn thảo rồi lưu thành một file mới. Ứng dụng không có nút hoàn tác.','You can still get it back by hand: open the file in the archive folder in an editor and save it as a new file. The app has no undo button.'],
 mf_will_html:['MANIFEST và bản HTML của hướng dẫn không được cập nhật. Việc này không xác nhận bản hiện hành là đúng hay mới nhất.','MANIFEST and the guide HTML are not updated. This does not confirm that the current file is correct or the latest.'],
 mf_will_two:['Đây là hai bước tách rời và có thể bị gián đoạn; nếu gián đoạn, ứng dụng báo đúng bước đang dở.','These are two separate steps and can be interrupted; if so, the app reports exactly which step is unfinished.'],
 mf_same:['Hai bản đang giống hệt nhau.','The two versions are identical.'],
 mf_differ:['Hai bản khác nhau: xem phần so sánh bên dưới. Bản hiện hành được giữ; các thay đổi trong .new sẽ không được dùng.','The two versions differ: see the comparison below. The current file is kept; the changes in the .new will not be used.'],
 mf_confirm:['Xác nhận: lưu .new và kết thúc chờ','Confirm: save .new and end the pending item'],
 mf_arc_lbl:['Thư mục lưu trữ','Archive folder'],mf_arc_cur:['Bản hiện hành đã lưu (current.txt)','Stored current file (current.txt)'],
 mf_arc_new:['Bản .new đã lưu (incoming.txt)','Stored .new copy (incoming.txt)'],mf_arc_ret:['Bản .new đã chuyển vào (pending-retired.txt)','Moved .new file (pending-retired.txt)'],
 mf_done:['Đã lưu .new vào thư mục lưu trữ và chuyển nó khỏi danh sách chờ. Bản hiện hành giữ nguyên.','The .new was stored in the archive folder and moved out of the pending list. The current file is unchanged.'],
 mf_done_note:['Lấy lại bản .new: mở pending-retired.txt bằng trình soạn thảo rồi lưu thành một file mới. MANIFEST và HTML không đổi; việc này không xác nhận nội dung bản hiện hành. Nếu sau này có file .new mới, nó sẽ hiện lại trong danh sách.','To get the .new back: open pending-retired.txt in an editor and save it as a new file. MANIFEST and HTML are unchanged; this does not confirm the current content. If a new .new file appears later, it will show in the list again.'],
 mf_still:['Bản sao lưu đã được lưu, nhưng file .new CHƯA được chuyển; nó vẫn nằm trong danh sách chờ. Bản hiện hành không đổi. Bước tiếp: xem lý do bên dưới, rồi xem trước và thử lại, hoặc bấm Kiểm lại kết quả.','The backup copies were stored, but the .new file was NOT moved; it is still in the pending list. The current file is unchanged. Next step: read the reason below, then preview and try again, or press Check the result again.'],
 mf_no_rollback:['Không dùng Phục hồi ở trang Tình trạng cho trường hợp này: giao dịch lưu đã hoàn tất và Phục hồi không hoàn tác việc chuyển file.','Do not use Roll back on App status here: the storing transaction is complete and Roll back does not reverse a file move.'],
 mf_not_started:['Chưa lưu gì: file .new vẫn đang chờ và chưa có bản sao lưu đầy đủ. Bước tiếp: xem trước và thử lại nếu vẫn muốn.','Nothing was stored: the .new file is still waiting and there is no complete backup. Next step: preview and try again if you still want to.'],
 mf_partial:['Việc lưu bản sao lưu bị dở (mã giao dịch: %s). File .new CHƯA được chuyển và vẫn nằm trong danh sách chờ; bản hiện hành không đổi. Bước tiếp: mở trang Tình trạng ứng dụng, chọn Tiếp tục (chỉ hoàn tất phần lưu, không tự chuyển .new) hoặc Phục hồi (gỡ phần sao lưu vừa ghi).','Storing the backup copies was interrupted (transaction: %s). The .new file was NOT moved and is still in the pending list; the current file is unchanged. Next step: open App status and choose Resume (it only finishes the storing, it does not move the .new) or Roll back (it removes the backup copies just written).'],
 mf_w_archive_error:['Đã kiểm đủ bản lưu nhưng giao dịch báo lỗi sau commit; chưa thử chuyển .new. Không dùng Phục hồi cho giao dịch đã commit.','The stored copies were verified, but the transaction reported an error after commit; moving the .new was not attempted. Do not roll back a committed transaction.'],
 mf_unproven:['Chưa xác minh được việc lưu bản sao lưu (mã giao dịch: %s) nên .new chưa được chuyển. Bước tiếp: kiểm tra thư mục lưu trữ bên dưới và bản hiện hành; chỉ dùng Tiếp tục/Phục hồi ở trang Tình trạng ứng dụng nếu giao dịch còn dở.','The stored backup copies could not be verified (transaction: %s), so the .new was not moved. Next step: inspect the archive folder below and the current file; use Resume/Roll back on App status only if a transaction is unfinished.'],
 mf_conflict:['Các file không khớp kết quả dự kiến nên không coi là đã kết thúc. Ứng dụng không xóa hay chuyển ngược file nào. Bước tiếp: kiểm tay các file ở thư mục lưu trữ bên dưới và vị trí .new cũ rồi quyết định.','The files do not match the expected result, so this is not treated as finished. The app deletes nothing and moves nothing back. Next step: check the files in the archive folder below and the old .new location by hand, then decide.'],
 mf_unknown_state:['Chưa xác định được kết quả. Ứng dụng không xóa hay chuyển thêm file nào. Bước tiếp: kiểm tay thư mục lưu trữ và vị trí .new cũ, rồi bấm Kiểm lại kết quả.','The outcome could not be determined. The app deletes and moves nothing more. Next step: check the archive folder and the old .new location by hand, then press Check the result again.'],
 mf_net:['Chưa biết kết quả vì mất kết nối với ứng dụng. Ứng dụng không gửi lại lệnh. Bước tiếp: bấm Kiểm lại kết quả để xem tình trạng thật của các file.','The outcome is not known because the connection to the app was lost. The command is not sent again. Next step: press Check the result again to see the real state of the files.'],
 mf_stale:['File đã đổi sau khi bạn xem trước nên chưa ghi gì. Bước tiếp: quay lại, mở so sánh rồi xem trước lại.','A file changed after your preview, so nothing was written. Next step: go back, open the comparison and preview again.'],
 mf_collision:['Thư mục lưu trữ bị trùng tên nên chưa ghi gì. Bước tiếp: xem trước lại để nhận mã mới.','The archive folder name was already taken, so nothing was written. Next step: preview again to get a new id.'],
 mf_err:['Chưa lưu được. Không có file nào bị thay đổi. Bước tiếp: thử lại; nếu vẫn lỗi, tạo gói chẩn đoán.','It could not be stored. No file was changed. Next step: try again; if it still fails, create a diagnostics bundle.'],
 mf_r_missing:['Thiếu bản hiện hành hoặc bản .new nên chưa lưu được. Không có gì bị thay đổi.','The current file or the .new copy is missing, so nothing can be stored. Nothing was changed.'],
 mf_r_content:['File không phải văn bản UTF-8 thuần, quá lớn hoặc phần khác biệt quá dài để xem hết, nên ứng dụng không tự lưu. Không có gì bị thay đổi.','The file is not plain UTF-8 text, is too large, or the differences are too long to review in full, so the app does not store it. Nothing was changed.'],
 mf_r_unsafe:['Không kiểm được an toàn của đường dẫn hoặc không đọc được file (liên kết, thư mục lạ hoặc lỗi đọc), nên chưa lưu. Không có gì bị thay đổi.','The path could not be checked as safe or the file could not be read (a link, an unexpected folder or a read error), so nothing is stored. Nothing was changed.'],
 mf_r_pending:['Đang có giao dịch lưu file chưa hoàn tất nên chưa lưu. Bước tiếp: mở trang Tình trạng ứng dụng, chọn Tiếp tục hoặc Phục hồi, rồi so sánh lại. Không có gì bị thay đổi.','An unfinished file transaction exists, so nothing is stored. Next step: open App status, choose Resume or Roll back, then compare again. Nothing was changed.'],
 mf_r_os:['Chỉ Windows mới tự chuyển file .new; hệ điều hành này không được hỗ trợ nên ứng dụng không làm gì. Bạn vẫn có thể chép đường dẫn và tự xử lý. Không có gì bị thay đổi.','Only Windows moves the .new file automatically; this system is not supported, so the app does nothing. You can still copy the paths and handle it yourself. Nothing was changed.'],
 mf_r_fs:['Không chứng minh được thư mục lưu trữ cùng ổ đĩa với file .new nên chưa lưu. Không có gì bị thay đổi.','The archive folder could not be shown to be on the same drive as the .new file, so nothing is stored. Nothing was changed.'],
 mf_r_other:['Ứng dụng không tự lưu mục này. Không có gì bị thay đổi.','The app does not store this item automatically. Nothing was changed.'],
 mf_w_slot:['Ô lưu pending-retired.txt đã có sẵn nên ứng dụng không chuyển đè lên.','The pending-retired.txt slot already exists, so the app does not move over it.'],
 mf_w_rename:['Hệ điều hành không cho chuyển file .new (có thể đang mở trong ứng dụng khác hoặc bị khóa).','The system did not allow the .new file to be moved (it may be open in another application or locked).'],
 mf_w_cand:['File .new đã đổi so với bản bạn xem trước.','The .new file changed since your preview.'],
 mf_w_cur:['Bản hiện hành đã đổi hoặc không còn so với lúc bạn xem trước.','The current file changed or is gone since your preview.'],
 mf_w_both:['Có cả file .new ở vị trí cũ lẫn file ở ô lưu trữ. Danh sách chờ chỉ theo file .new đang có thật.','There is both a .new file at the old place and a file in the archive slot. The pending list only follows the .new file that exists.'],
 mf_w_moved:['File ở ô lưu trữ khác bản .new bạn đã xem. Ứng dụng giữ nguyên, không xóa hay chuyển ngược.','The file in the archive slot differs from the .new you looked at. The app leaves it as it is and does not delete or move it back.'],
 mf_w_absent:['Không thấy .new ở vị trí cũ lẫn ở ô lưu trữ.','The .new is found neither at the old place nor in the archive slot.'],
 mf_w_arch:['Bản sao lưu chưa được xác minh đầy đủ (nhật ký hoặc file đã lưu chưa khớp).','The backup copies are not fully verified (the journal or the stored files do not match).'],
 mf_w_unsafe:['Có file không đọc được, hoặc là liên kết hay thư mục lạ.','A file could not be read, or is a link or an unexpected folder.'],
 mf_w_platform:['Hệ điều hành hoặc ổ đĩa này không được hỗ trợ cho việc chuyển file tự động.','This system or drive is not supported for the automatic move.'],
 mf_w_after_error:['Hệ thống báo lỗi nhưng khi kiểm lại thì file đã được chuyển đúng.','The system reported an error, but on checking the file had been moved correctly.'],
 mf_w_other:['Có điểm chưa khớp; xem các file bên dưới.','Something does not match; see the files below.'],
 bn_init_t:['Thư mục này chưa là dự án','This folder is not a project yet'],bn_init_p:['Khởi tạo để điền PROJECT.md, đặt STATE sạch và bật các chức năng cài gói, cập nhật.','Set it up to fill PROJECT.md, start a clean STATE and enable packs and upgrades.'],bn_init_b:['Khởi tạo','Set up'],
 k_skills:['Kỹ năng trong chỉ mục','Skills in the index'],k_packs:['Gói lĩnh vực đã cài','Domain packs installed'],k_out:['File trong output','Files in output'],k_ref:['File nguồn (references)','Source files (references)'],
 state_t:['Trạng thái công việc','Work status'],quick_t:['Lối tắt','Shortcuts'],state_empty:['Chưa có trạng thái','No status yet'],state_empty_p:['Trợ lý AI ghi vào .agent/STATE.md khi làm việc: mục tiêu, giai đoạn, việc chờ bạn.','The assistant writes .agent/STATE.md while working: goal, phase, what waits on you.'],
 upd:['cập nhật','updated'],
 q1:['Kiểm tra file trước khi giao','Check a file before delivery'],q1d:['Chỗ chưa điền, nhãn mẫu, tài nguyên mạng','Placeholders, demo labels, network resources'],
 q2:['Gói lĩnh vực','Domain packs'],q2d:['Cài bộ kỹ năng theo mảng việc','Install skill sets by line of work'],
 q3:['Đưa kỹ năng vào Claude, Codex, Gemini','Put skills into Claude, Codex, Gemini'],q3d:['Hiện trong menu của ứng dụng','Show them in the app menu'],
 q4:['Cập nhật bộ công cụ','Upgrade the package'],q4d:['Giữ nguyên file bạn đã sửa','Keeps the files you changed'],
 skills_t:['Kỹ năng trong dự án','Skills in this project'],col_scope:['Phạm vi','Scope'],col_use:['Dùng khi','Use when'],all:['Tất cả','All'],f_shared:['Dùng chung','Shared'],f_pack:['Gói','Pack'],f_proj:['Riêng','Project'],no_match:['Không có kỹ năng phù hợp.','No matching skill.'],n_skills:['kỹ năng','skills'],
 ck_p:['Kiểm tra cơ học: chỗ chưa điền, nhãn mẫu minh họa còn sót, tài nguyên mạng trong HTML, lỗi bảng tính. Không thay việc đọc lại và đối chiếu số liệu với nguồn.','A mechanical check: unfilled placeholders, leftover demo labels, network resources in HTML, spreadsheet issues. It does not replace re-reading and checking figures against sources.'],
 ck_drop:['Chọn file cần kiểm tra','Choose files to check'],ck_types:['.docx · .xlsx · .csv · .html · .md · .txt','.docx · .xlsx · .csv · .html · .md · .txt'],ck_or:['Hoặc dán đường dẫn file','Or paste a file path'],add:['Thêm','Add'],
 ck_decl:['Đây là câu trả lời đã lưu của trợ lý AI: kiểm khối "Khai báo thực hiện"','This is a saved assistant reply: check the "Execution declaration" block'],ck_ro:['Chỉ đọc, không sửa file.','Read only; files are not changed.'],ck_run:['Kiểm tra','Check'],ck_none:['Chưa có file nào để kiểm. Bước tiếp: bấm Chọn file hoặc dán đường dẫn, rồi bấm Thêm.','No file to check yet. Next step: press Choose files or paste a path, then press Add.'],
 pk_p:['Bộ kỹ năng theo mảng việc, cài vào dự án khi cần. Gói "thử nghiệm" chưa qua tiếp nhận: cài để dùng thử trong dự án này, trợ lý AI nói rõ là bản thử, không chép sang ứng dụng. Mỗi gói có bảng căn cứ pháp lý ghi số hiệu, điều khoản và ngày đối chiếu để bạn kiểm lại. Gỡ gói chỉ chuyển thư mục vào archive/.','Skill sets by line of work, installed into a project when needed. A "trial" pack has not been through intake: install it to try in this project; the assistant says it is a trial, and it is not copied into apps. Each pack has a legal-basis table with numbers, articles and the check date so you can verify. Removing a pack only moves its folder into archive/.'],
 pk_need:['Thư mục này là bộ mẫu, chưa phải dự án, nên không cài gói ở đây. Tạo dự án mới từ bộ mẫu rồi cài gói trong bảng điều khiển của dự án đó; với dự án có sẵn, cập nhật bộ công cụ cho dự án đó trước.','This folder is the template, not a project, so packs are not installed here. Create a new project from the template, then install packs from that project\u2019s panel; for an existing project, update its package first.'],
 pk_need_a:['Đưa vào dự án →','Bring into a project →'],pk_to_proj:['Cài vào dự án','Install in a project'],
 up_self:['Cập nhật thư mục đang mở','Update the open folder'],up_other:['Cập nhật một dự án khác','Update another project'],
 up_other_p:['Dùng bản bộ công cụ đang mở để cập nhật một dự án đã có (thêm file mới, cập nhật file chưa sửa, giữ file bạn đã sửa). Dự án chưa từng dùng bộ công cụ thì dùng Khởi tạo → Dự án đã có.','Use the package you have open to upgrade an existing project (adds new files, updates untouched files, keeps the ones you changed). A project that never used the package: use Set up → Existing project.'],
 up_to:['Thư mục dự án cần cập nhật','Project folder to upgrade'],

function fmtDate(sec){var d=new Date(sec*1000);function z(n){return(n<10?'0':'')+n;}return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes());}
function mdl(lines){return lines.map(function(l){var h=/^\s*#{1,6}\s+/.test(l);var e=esc(l.replace(/^\s*#{1,6}\s+/,'')).replace(/`([^`]+)`/g,'<code class="mono">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');return h?'<b class="sub-h">'+e+'</b>':e;}).join('\n');}
function fitBrand(){/* tên đơn vị dài: thu nhỏ chữ cho vừa một dòng / long brand names shrink to fit one line */

  while(el.scrollWidth>el.clientWidth&&f>11){f-=.5;el.style.fontSize=f+'px';}
}

function cdRow(x,opts){var dir=x.path.split('/').slice(0,-1).join('/'),warn=x.state!=='matched';

  var sel=opts&&opts.select&&x.state==='matched'?'<button class="btn" data-cdp="'+esc(x.rid)+'" aria-label="'+esc(t('cd_select')+': '+x.name)+'">'+esc(t('cd_select'))+'</button>':'';
  return'<div class="fr"><span class="ic">'+ico('file')+'</span><div class="nm"><b title="'+esc(x.path)+'">'+esc(x.name)+'</b><span>'+esc(dir+'/')+(x.at?' · '+esc(fmtIso(x.at)):'')+'</span></div>'+cdTag(x.state)+open+sel+'</div>';}
function cdDraw(){var box=$('cd-box'),tag=$('cd-tag');if(!box)return;tag.hidden=true;

  if(CD.result!=='OK'){box.innerHTML='<div class="note warn">'+ico('alert')+'<span>'+esc(t('cd_unavail'))+' <span class="mono">'+esc(CD.reason||'')+'</span></span></div>';return;}
  var ptr=CD.pointer||{},h='';
  if(ptr.state==='UNRESOLVED'){h='<div class="note warn">'+ico('alert')+'<span>'+esc(t('cd_unres'))+' <span class="mono">'+esc(ptr.reason||'')+'</span></span></div>';}
  else if(ptr.state==='NONE'||!CD.selected){h='<p>'+esc(t('cd_none'))+'</p><div class="hact"><button class="btn pri" id="cd-pick">'+ico('file')+esc(t('cd_pick'))+'</button></div>';}
  else{var s=CD.selected;tag.hidden=false;tag.className='tag '+(s.state==='matched'?'ok':s.state==='unopenable'?'err':'warn');tag.textContent=t('cd_s_'+s.state);
    h='<div class="flist">'+cdRow(s)+'</div><div class="hact"><button class="btn" id="cd-cont">'+ico('copy')+esc(t('cd_cont'))+'</button><button class="btn ghost" id="cd-pick">'+esc(t('cd_other'))+'</button></div>';
    if(s.work_id){h+='<h3 class="hint" style="margin:14px 0 4px">'+esc(t('cd_hist'))+'</h3>';
      h+=(CD.history||[]).length?'<div class="flist">'+CD.history.map(function(x){return cdRow(x,{select:true});}).join('')+'</div>':'<p class="hint">'+esc(t('cd_none_hist'))+'</p>';
      if(CD.more>0)h+='<div class="more">'+esc(t('cd_more').replace('%d',CD.more))+'</div>';}
    if(CD.incomplete)h+='<div class="note warn">'+ico('alert')+'<span>'+esc(t('cd_incomplete'))+'</span></div>';}
  box.innerHTML=h+'<div id="cd-list"></div>'+note;}

function cdApply(rid,pv){if(busy)return;openSheet(t('cd_sel_t'),'file',true);$('sh-s2').classList.add('on');setBusy(true,null);
  api('/api/draft/select',{rid:rid,apply:true,expected_state:pv.state_sha256,expected_selection:pv.selection_fingerprint}).then(function(r){setBusy(false,null);

function drawList(k,data,emptyKey,icon,drafts){data=data||{items:[],total:0};

  if(kind==='copy'){if(v)copyText(v);return Promise.resolve('copied');}
  return Promise.resolve(null);}
$('sh-diff').addEventListener('click',function(e){var b=e.target.closest('[data-mf]');if(b)mfAct(b.dataset.mf,b.dataset.v||'');});
// D01C-END
// status page (read only apart from the buttons that act on purpose)
function actLabel(a){return t(D['act_'+a]?'act_'+a:'act_unknown');}
function fmtIso(s){var d=new Date(s);return isNaN(d.getTime())?String(s||''):fmtDate(d.getTime()/1000);}
var TONE={success:'ok',preview:'info',issues:'warn',not_checked:'warn',blocked:'warn',partial:'warn',error:'err'};
function stTag(st){return'<span class="tag '+(TONE[st]||'')+'">'+esc(t('result_'+st))+'</span>';}
function drawHealth(){var s=S,kind=s.workspace_kind||'unknown';
  $('hl-app').innerHTML=[[t('h_version'),'v'+esc(s.version)],
    [t('h_kind'),'<span class="tag '+(s.initialized?'ok':'warn')+'">'+esc(t(kind==='project'?'st_ready':kind==='template'?'st_template':'st_unknown'))+'</span>'],
    [t('h_evidence'),esc(t('evidence_'+kind))],[t('h_python'),esc(s.python)],[t('h_platform'),esc(s.platform||'')]
  ].map(function(x){return'<div class="it"><dt>'+esc(x[0])+'</dt><dd>'+x[1]+'</dd></div>';}).join('');
  var FEAT={python:'f_python',library:'f_library',xlsx:'f_xlsx',picker:'f_picker',controlled:'f_controlled'};
  $('hl-comp').innerHTML=(s.components||[]).map(function(c){var ok=!!c.usable,fix='',why=esc(t('why_label')),how=esc(t('fix_label'));
    if(!ok&&c.feature==='python')fix='<div class="hfix"><b>'+why+':</b> '+esc(t('why_py'))+'<br><b>'+how+':</b> '+esc(t('fix_py'))+'</div>';
    else if(!ok&&c.feature==='picker')fix='<div class="hfix"><b>'+why+':</b> '+esc(t('why_tk'))+'<br><b>'+how+':</b> '+esc(t('fix_tk'))+'</div>';
    else if(!ok&&c.feature==='controlled'){var rc=c.reason||'',msg=D['cw_'+rc]?t('cw_'+rc):t('cw_OTHER'),cmd=rc==='DEPENDENCY_MISSING'?'<br><code class="mono">'+esc(c.python_path||'python')+' -m pip install "jsonschema>=4.18"</code>':'';
      fix='<div class="hfix"><b>'+why+':</b> '+esc(msg)+' <span class="mono">'+esc(rc)+'</span><br><b>'+how+':</b> '+esc(t(rc==='DEPENDENCY_MISSING'?'fix_cw_dep':'fix_cw_other'))+cmd+'</div>';}
    else if(!ok)fix='<div class="hfix"><b>'+why+':</b> '+esc(t('why_opx'))+'<br><b>'+how+':</b> <code class="mono">python -m pip install openpyxl</code><br>'+esc(t('fix_opx'))+'</div>';
    var sub=c.feature==='python'?'Python '+esc(c.version):(c.feature==='controlled'?'<span class="mono">Python '+esc(c.version)+(c.jsonschema?' · jsonschema '+esc(c.jsonschema):'')+(c.fs?' · '+esc(c.fs):'')+'</span>':'<span class="mono">'+esc(c.needs)+'</span>');
    return'<div class="hrow"><div class="hmain"><b>'+esc(t(FEAT[c.feature]||c.feature))+'</b><span class="hsub">'+sub+'</span>'+fix+'</div><span class="tag '+(ok?'ok':'warn')+'">'+ico(ok?'check':'alert')+esc(t(ok?'usable':'not_usable'))+'</span></div>';}).join('');
  var tx=s.transactions||[];
  // one row per unfinished transaction; the buttons wrap below the details on narrow screens
  $('hl-tx').innerHTML=tx.length?tx.map(function(x){var id=esc(x.id),op=D['tx_op_'+x.operation]?t('tx_op_'+x.operation):esc(x.operation||'');
      return'<div class="hrow"><div class="hmain"><b>'+op+'</b><span class="hsub mono">'+id+'</span>'
        +'<span class="hsub"><span class="tag warn">'+esc(t('tx_st'))+'</span> '+esc(String(x.done))+'/'+esc(String(x.total))+' · '+esc(fmtIso(x.created))+'</span></div>'
        +'<div class="hact"><button class="btn pri" data-txa="resume" data-tx="'+id+'">'+ico('refresh')+esc(t('tx_resume'))+'</button><button class="btn" data-txa="rollback" data-tx="'+id+'">'+ico('undo')+esc(t('tx_rollback'))+'</button></div></div>';}).join('')
    :'<div class="empty" style="padding:16px">'+ico('check')+'<span>'+esc(t('h_tx_none'))+'</span></div>';
  var n=(s.merges||[]).length;
  $('hl-merges').innerHTML=n?'<div class="hrow"><div class="hmain"><b>'+n+'</b><span class="hsub">'+esc(t('hl_merge_count'))+'</span></div></div>'
    :'<div class="empty" style="padding:16px">'+ico('check')+'<span>'+esc(t('hl_none_merge'))+'</span></div>';
  var sum=s.history_summary||{},hist=s.history||[];
  function last(label,r){return'<div class="hrow"><div class="hmain"><b>'+esc(t(label))+'</b><span class="hsub">'+(r?esc(fmtIso(r.time))+' · '+esc(actLabel(r.action))+' · '+stTag(r.status):esc(t('hist_none')))+'</span></div></div>';}
  $('hl-last').innerHTML=last('hist_last_ok',sum.last_success)+last('hist_last_fail',sum.last_failure)+last('hist_last_unf',sum.last_unfinished);
  $('hl-hist').innerHTML=hist.length?'<table><thead><tr><th>'+esc(t('hist_c_time'))+'</th><th>'+esc(t('hist_c_act'))+'</th><th>'+esc(t('hist_c_st'))+'</th><th style="width:90px">'+esc(t('hist_c_files'))+'</th></tr></thead><tbody>'
    +hist.map(function(r){return'<tr><td>'+esc(fmtIso(r.time))+'</td><td>'+esc(actLabel(r.action))+'</td><td>'+stTag(r.status)+'</td><td>'+esc(String(r.files))+'</td></tr>';}).join('')+'</tbody></table>'
    :'<div class="empty" style="padding:16px">'+esc(t('hist_empty'))+'</div>';}
function drawSkills(){var q=($('sk-q').value||'').toLowerCase(),rows=S.skills.filter(function(r){return(skFilter==='all'||r.scope===skFilter)&&(!q||(r.id+' '+r.use).toLowerCase().indexOf(q)>=0);});
  $('sk-count').textContent=S.skills.length+' '+t('n_skills');
  $('sk-rows').innerHTML=rows.length?rows.map(function(r){var c=r.scope==='PACK'?'acc':(r.scope==='PROJECT'?'warn':'');
    var st=r.status==='REVIEW'?' <span class="tag warn">'+esc(t('st_review'))+'</span>':r.status==='DISABLED'?' <span class="tag">'+esc(t('st_off'))+'</span>':'';
    return'<tr><td class="id">'+esc(r.id)+st+'</td><td><span class="tag '+c+'">'+esc(r.scope==='SHARED'?t('f_shared'):r.scope==='PACK'?t('f_pack'):r.scope==='PROJECT'?t('f_proj'):r.scope)+'</span></td><td>'+esc(r.use)+'</td></tr>';}).join('')
    :'<tr><td colspan="3"><div class="empty" style="padding:14px">'+esc(t('no_match'))+'</div></td></tr>';}
$('sk-q').addEventListener('input',function(){if(S)drawSkills();});
function refresh(){return api('/api/status').then(function(s){S=s;paint();cdLoad();}).catch(function(e){if(String(e).indexOf('forbidden')>=0)$('off').classList.add('on');});}
function setTheme(v){if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');themeIcon();}
setTheme(store('panel.theme'));
$('b-theme').addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var n=c==='dark'?'light':'dark';setTheme(n);store('panel.theme',n);});
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;store('panel.lang',lang);closeSheet();paint();});});
$('b-quit').addEventListener('click',function(){api('/api/quit').finally(function(){$('off').classList.add('on');});});
setInterval(function(){api('/api/ping').catch(function(){$('off').classList.add('on');});},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
lang=store('panel.lang')||'vi';page=store('panel.page')||'home';if(!$('pg-'+page))page='home';
paint();go(page);
refresh().then(function(){if(!store('panel.lang')&&S&&S.lang){lang=S.lang;paint();}});
})();
</script>
